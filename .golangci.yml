version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - sqlclosecheck
    - misspell
  settings:
    errcheck:
      check-blank: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
